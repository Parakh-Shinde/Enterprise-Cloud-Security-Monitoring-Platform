name: SPL Detection Quality Checks

on:
  push:
    branches:
      - main
    paths:
      - "detections/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/detection-quality.yml"
  pull_request:
    branches:
      - main
    paths:
      - "detections/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/detection-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: detection-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-detections:
    name: Validate SPL detection content
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate production SPL files
        run: python scripts/validate_detections.py

      - name: Run validator unit tests
        run: python -m unittest discover --start-directory tests --verbose
